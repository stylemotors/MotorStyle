<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MotorStyle | Art Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="art-store.css">
</head>
<body>

  <!-- HEADER SIMPLES -->
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">MotorStyle</a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="art-store.html" class="active">Art Store</a>
      </nav>
    </div>
  </header>

  <!-- SUA SEÇÃO (INALTERADA) -->
  <section id="art-store" class="art-store-section">
    <div class="container">
      <h2 class="section-title">Art Store</h2>
      <p class="section-subtitle">
        Peças de arte, decoração e design automotivo premium
      </p>

      <div class="products-grid">
        <div class="product-card">
          <img src="imagens/IMG_7152.webp" alt="Produto 1">
          <h3 class="product-name">Produto 1</h3>
          <p class="product-price">R$ 199,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

        <div class="product-card">
          <img src="imagens/IMG_7153.webp" alt="Produto 2">
          <h3 class="product-name">Produto 2</h3>
          <p class="product-price">R$ 249,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

        <div class="product-card">
          <img src="imagens/IMG_7154.webp" alt="Produto 3">
          <h3 class="product-name">Produto 3</h3>
          <p class="product-price">R$ 310,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

        <div class="product-card">
          <img src="imagens/produto4.jpg" alt="Produto 4">
          <h3 class="product-name">Produto 4</h3>
          <p class="product-price">R$ 180,00</p>
          <button class="btn-buy">Comprar</button>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 MotorStyle</p>
  </footer>

</body>
</html>
