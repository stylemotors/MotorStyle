<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MotorStyle | Art Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS PRINCIPAL DO SITE -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MENU IGUAL AO DA HOME -->
  <header class="top-menu">
    <img src="images/logo.svg" alt="MotorStyle" class="menu-logo">

    <nav class="menu-links">
      <a href="index.html">Home</a>
      <a href="art-store.html" class="active">Art Store</a>
    </nav>
  </header>

  <!-- ART STORE -->
  <section id="art-store" class="art-store-section">
    <div class="container">
      <h2 class="section-title">Art Store</h2>
      <p class="section-subtitle">
        Peças de arte, decoração e design automotivo premium
      </p>

      <div class="products-grid">

        <div class="product-card">
          <img src="images/RedBull- FrontWing.png" alt="Produto 1">
          <h3 class="product-name">Produto 1</h3>
          <p class="product-price">R$ 199,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

        <div class="product-card">
          <img src="images/Ferrari- FrontWing.png" alt="Produto 2">
          <h3 class="product-name">Produto 2</h3>
          <p class="product-price">R$ 249,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

        <div class="product-card">
          <img src="images/McLaren- FrontWing.png" alt="Produto 3">
          <h3 class="product-name">Produto 3</h3>
          <p class="product-price">R$ 310,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

        <div class="product-card">
          <img src="images/produto4.jpg" alt="Produto 4">
          <h3 class="product-name">Produto 4</h3>
          <p class="product-price">R$ 180,00</p>
          <button class="btn-buy">Comprar</button>
        </div>

      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 MotorStyle</p>
  </footer>

</body>
</html>
